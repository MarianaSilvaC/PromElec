# =====================================================================================
# Nginx como PROXY INVERSO y BALANCEADOR DE CARGA para la API de PromElec.
# Corre en el contenedor "promelec-nginx" (deploy/docker-compose.yml) y se monta en
# /etc/nginx/conf.d/default.conf.
#
#   Internet --> :8088 --> (puerto 80 del contenedor)  --> redirige a HTTPS
#   Internet --> :8443 --> (puerto 443 del contenedor) --> TLS + cabeceras --> api1 o api2
#
# En el VPS los puertos 80/443 los usa Traefik (Easypanel); por eso los públicos son 8088/8443.
# =====================================================================================

# DNS interno de Docker: permite volver a resolver api1/api2 si sus contenedores se recrean.
resolver 127.0.0.11 valid=10s ipv6=off;

# ---------- Balanceo de carga ----------
# Round robin entre las dos instancias. "zone" hace que todos los procesos de Nginx compartan
# el turno (sin ella, cada proceso empieza siempre por la instancia 1).
# Si una instancia falla 3 veces, se saca 30 s y todo el tráfico va a la otra.
upstream promelec_api {
    zone promelec_api 64k;
    server api1:80 resolve max_fails=3 fail_timeout=30s;   # instancia 1
    server api2:80 resolve max_fails=3 fail_timeout=30s;   # instancia 2
    keepalive 16;
}

# ---------- HTTP: todo se redirige a HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    server_tokens off;
    return 301 https://$host:8443$request_uri;
}

# ---------- HTTPS ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # Certificado autofirmado para la IP del VPS (se genera en el paso 5 de docs/Despliegue.md).
    ssl_certificate     /etc/nginx/ssl/promelec.crt;
    ssl_certificate_key /etc/nginx/ssl/promelec.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # No revelar la versión de Nginx.
    server_tokens off;

    # Rechaza cuerpos de petición enormes (la API no recibe archivos).
    client_max_body_size 1m;

    # ---------- Cabeceras de seguridad ----------
    # Nginx es el único que las pone: se ocultan las que manda la API para no duplicarlas.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # La Content-Security-Policy la sigue poniendo la API, porque depende de sus páginas.

    # Solo para demostrar el balanceo: indica qué instancia respondió.
    add_header X-Upstream $upstream_addr always;

    location / {
        proxy_pass http://promelec_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Datos de la petición original para la API.
        # $http_host incluye el puerto (:8443), para que las URLs que genera la API sean correctas.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # Si una instancia falla, Nginx reintenta la petición en la otra.
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
