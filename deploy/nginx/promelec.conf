# =====================================================================================
# Nginx como PROXY INVERSO y BALANCEADOR DE CARGA para la API de PromElec.
# Va en el servidor en: /etc/nginx/sites-available/promelec  (y enlazado en sites-enabled)
#
#   Internet --> Nginx :80  --> redirige a HTTPS
#   Internet --> Nginx :443 --> (TLS + cabeceras de seguridad) --> instancia 1 o instancia 2
# =====================================================================================

# ---------- Balanceo de carga ----------
# Las dos instancias de la API (contenedores Docker) solo escuchan en 127.0.0.1.
# Por defecto Nginx las alterna (round robin). Si una falla 3 veces, la saca 30 s
# y manda todo el tráfico a la otra.
upstream promelec_api {
    # "zone": todos los procesos de Nginx comparten el turno del round robin.
    # Sin ella, cada proceso lleva su propia cuenta y casi siempre empieza por la instancia 1.
    zone promelec_api 64k;
    server 127.0.0.1:5000 max_fails=3 fail_timeout=30s;   # instancia 1
    server 127.0.0.1:5001 max_fails=3 fail_timeout=30s;   # instancia 2
    keepalive 16;
}

# ---------- HTTP (puerto 80): todo se redirige a HTTPS ----------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    return 301 https://$host$request_uri;
}

# ---------- HTTPS (puerto 443) ----------
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    # Certificado. Sin dominio se usa uno autofirmado para la IP (ver docs/Despliegue.md).
    # Con dominio se cambia por el de Let's Encrypt (certbot).
    ssl_certificate     /etc/nginx/ssl/promelec.crt;
    ssl_certificate_key /etc/nginx/ssl/promelec.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # No revelar la versión de Nginx.
    server_tokens off;

    # Rechaza cuerpos de petición enormes (la API no recibe archivos).
    client_max_body_size 1m;

    # ---------- Cabeceras de seguridad ----------
    # Nginx es el único que las pone: se ocultan las que manda la API para no duplicarlas.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # La Content-Security-Policy la sigue poniendo la API, porque depende de sus páginas.

    # Solo para demostrar el balanceo: indica qué instancia respondió (127.0.0.1:5000 o :5001).
    add_header X-Upstream $upstream_addr always;

    location / {
        proxy_pass http://promelec_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Datos de la petición original para la API (IP real del cliente y que llegó por HTTPS).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # Si una instancia falla, Nginx reintenta la petición en la otra.
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
