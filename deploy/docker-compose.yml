# =====================================================================================
# PromElec en el VPS (Hostinger, Ubuntu 24.04) — despliegue AISLADO.
#
#   Internet --> :8088 (HTTP)  --> Nginx --> redirige a https://...:8443
#   Internet --> :8443 (HTTPS) --> Nginx (TLS + cabeceras + balanceo) --> api1 / api2 --> SQLite
#
# Convive con lo que ya hay en el servidor (Easypanel/Traefik en 80/443, n8n, etc.) sin tocarlo:
#   - Proyecto, red y volúmenes propios (todo se llama promelec-*).
#   - No usa los puertos 80/443 del servidor (son de Traefik).
#   - SQLite en lugar de SQL Server y límites de memoria: ~350 MB en total como máximo.
#
#   docker compose pull && docker compose up -d     -> levantar
#   docker compose ps                               -> estado
#   docker compose logs -f                          -> logs
#   docker compose down                             -> detener (los datos quedan en los volúmenes)
#
# Los secretos se leen del archivo .env de esta carpeta (no se sube a git).
# =====================================================================================
name: promelec-prod

x-api: &api
  image: ${API_IMAGE:-marianasilcam05/promelec-api:1.1}   # imagen publicada en Docker Hub
  environment:
    Database__Provider: "Sqlite"
    ConnectionStrings__DefaultConnection: "Data Source=/app/data/promelec.db"
    Jwt__Key: ${JWT_KEY:?Falta JWT_KEY en el archivo .env}
    SeedAdmin__Password: ${ADMIN_PASSWORD:?Falta ADMIN_PASSWORD en el archivo .env}
    # Nombres de host aceptados: la IP pública del VPS y localhost (para el healthcheck).
    AllowedHosts: "${SERVER_HOST:?Falta SERVER_HOST en el archivo .env};localhost"
    # Detrás de Nginx: la API confía en X-Forwarded-Proto/For para saber que la conexión original
    # fue HTTPS y cuál es la IP real del cliente. Es seguro porque las instancias NO publican
    # puertos: solo Nginx las alcanza por la red interna "promelec".
    ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
  volumes:
    - promelec-data:/app/data   # archivo SQLite (compartido por las dos instancias)
    - promelec-keys:/app/keys   # llaves de Data Protection (compartidas)
  networks: [promelec]
  healthcheck:
    # La imagen de .NET no trae curl: se consulta /health con bash puro.
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/80 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 30s
  # Límites para no quitarle recursos a los demás servicios del VPS.
  mem_limit: 256m
  cpus: 0.5
  restart: unless-stopped

services:
  # Instancia 1: crea la base de datos y el usuario Admin al arrancar.
  api1:
    <<: *api
    container_name: promelec-api-1

  # Instancia 2: arranca cuando la 1 ya está sana (así no compiten al crear la base).
  api2:
    <<: *api
    container_name: promelec-api-2
    depends_on:
      api1:
        condition: service_healthy

  # Proxy inverso y balanceador de carga.
  nginx:
    image: nginx:1.30-alpine
    container_name: promelec-nginx
    ports:
      - "8443:443"   # HTTPS público
      - "8088:80"    # HTTP público (solo redirige a HTTPS)
    volumes:
      - ./nginx/promelec.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks: [promelec]
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    mem_limit: 64m
    restart: unless-stopped

networks:
  promelec:

volumes:
  promelec-data:
  promelec-keys:
