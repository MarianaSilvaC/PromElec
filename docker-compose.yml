# =====================================================================================
# PromElec en contenedores: la API + su base de datos SQL Server.
#
#   docker compose up -d --build     -> construye la imagen y levanta todo
#   docker compose ps                -> estado de los contenedores
#   docker compose logs -f api       -> ver el log de la API
#   docker compose down              -> detener (los datos se conservan en el volumen)
#
# Los secretos se leen del archivo .env (copia .env.example y llena los valores).
# El archivo .env está en .gitignore: NUNCA se sube al repositorio (H-05).
# =====================================================================================
name: promelec

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: promelec-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Falta MSSQL_SA_PASSWORD en el archivo .env}
    volumes:
      - promelec-sqldata:/var/opt/mssql
    # Sin "ports": la base de datos NO se publica fuera de Docker; solo la API la alcanza
    # por la red interna de Docker (nombre de host "sqlserver").
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"SELECT 1\" -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  api:
    # Por defecto usa la imagen local. En .env puedes poner API_IMAGE=tuusuario/promelec-api:1.0
    # para descargarla de Docker Hub en lugar de construirla.
    image: ${API_IMAGE:-promelec-api:1.0}
    build:
      context: ./src/TiendaPromElec
    container_name: promelec-api
    depends_on:
      sqlserver:
        condition: service_healthy   # espera a que SQL Server responda antes de arrancar la API
    environment:
      # H-05: secretos por variables de entorno (el doble guion bajo "__" equivale a ":" en .NET).
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=PromElec;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY:?Falta JWT_KEY en el archivo .env}
      SeedAdmin__Password: ${ADMIN_PASSWORD:?Falta ADMIN_PASSWORD en el archivo .env}
    volumes:
      - promelec-keys:/app/keys   # llaves de Data Protection (antiforgery) persistentes
    ports:
      - "8080:80"   # http://localhost:8080 -> puerto 80 del contenedor
    restart: unless-stopped

volumes:
  promelec-sqldata:
  promelec-keys:
